services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # 避免端口冲突
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=tianru12
      - DB_NAME=blindbox_db
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped  # 自动重启

  mysql:
    image: mysql:8.0
    platform: linux/amd64  # Windows兼容性设置
    environment:
      - MYSQL_ROOT_PASSWORD=tianru12
      - MYSQL_DATABASE=blindbox_db
    ports:
      - "3307:3306"  # 避免端口冲突
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data: